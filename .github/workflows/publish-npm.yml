name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match package.json), e.g. v1.0.0
        required: true
        type: string

concurrency:
  group: publish-npm-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Validate and publish package
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must match vMAJOR.MINOR.PATCH."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Release tag commit is not contained in origin/main."
            exit 1
          fi

      - name: Validate
        run: bash scripts/validate.sh

      - name: Use Node.js for publish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Skip publish if version already on npm
        id: npm_exists
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@ysskrishna/claude-code-subagents-for-cursor@${VERSION}" version 2>/dev/null; then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm; skipping publish."
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm_exists.outputs.skip_publish != 'true'
        run: npm publish --access public
