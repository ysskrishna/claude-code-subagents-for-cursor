# Create a GitHub Release from the matching CHANGELOG.md version section.
name: Release

on:
  push:
    tags:
      # Publish on full version tags, e.g., v0.1.0
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag matches plugin.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python3 -c "import json; print(json.load(open('.cursor-plugin/plugin.json'))['version'])")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match .cursor-plugin/plugin.json version $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub release from changelog
        uses: ysskrishna/changelog-release-action@v1
